<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Higifácil – Sistema de Gestão para Higienizadores</title>

    <!-- SEO -->
    <meta name="description" content="Higifácil é o sistema de gestão completo para empresas de higienização e limpeza de estofados. Orçamentos, vendas, execução de OS, tapetes e financeiro em um só lugar." />
    <meta name="keywords" content="higienização, estofados, sistema de gestão, orçamentos, limpeza de sofá, tapetes, higienizadores" />
    <meta name="author" content="Higifácil" />
    <link rel="canonical" href="https://higifacil.com.br" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://higifacil.com.br" />
    <meta property="og:title" content="Higifácil – Sistema de Gestão para Higienizadores" />
    <meta property="og:description" content="Do orçamento à execução, do cliente ao financeiro. Tudo em um único sistema feito para empresas de higienização." />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663288781602/9tTW5oqRiGfeLkQJrVbUfh/logo_higifacil_final_e3e4210f.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Higifácil – Sistema de Gestão para Higienizadores" />
    <meta name="twitter:description" content="Do orçamento à execução, do cliente ao financeiro. Tudo em um único sistema feito para empresas de higienização." />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Analytics (Umami) desativado: as variáveis VITE_ANALYTICS_ENDPOINT e
      VITE_ANALYTICS_WEBSITE_ID vinham do ambiente da Manus. Sem elas, o Vite
      não substituía os placeholders e o navegador tentava carregar a URL
      literal "%VITE_ANALYTICS_ENDPOINT%/umami" (erro 400 + MIME type).
      Para reativar, defina as duas variáveis no .env e descomente o script.
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    -->
  </body>

</html>
